name: week7-ci

on:
  push:
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e services/api[dev]
      - name: Run API tests
        run: cd services/api && python -m pytest tests

  model-server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install model-server dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e services/model-server[dev]
      - name: Run model-server tests
        run: cd services/model-server && python -m pytest tests

  widget-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/widget/package-lock.json
      - name: Build widget
        run: |
          cd services/widget
          npm ci
          npm run build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint API
        run: ruff check services/api/maintcopilot_api --select E,F,W --ignore E501
      - name: Lint model-server
        run: ruff check services/model-server/maintcopilot_model_server --select E,F,W --ignore E501

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies + mypy
        run: |
          pip install mypy
          pip install -e services/api[dev]
      - name: Type-check API (non-blocking)
        run: mypy services/api/maintcopilot_api --ignore-missing-imports --no-error-summary || true

  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install local packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e services/api[dev]
          python -m pip install -e services/model-server[dev]
      - name: Verify Git LFS artifacts are present
        run: |
          git lfs pull
          test -s artifacts/classifier/transformer/model/model.safetensors || (echo "Missing classifier LFS artifact. Run git lfs pull." && exit 1)
      - name: Snapshot previous green reports
        run: |
          mkdir -p baseline-reports
          cp reports/*.json baseline-reports/ 2>/dev/null || true
      - name: Run eval gates
        run: |
          python scripts/verify_ml_artifacts.py
          python evals/classification_eval.py --model all --gate primary
          python evals/rag_retrieval_eval.py --retriever hybrid --alpha 0.5 --query-rewrite --metadata-boost --report-path reports/rag_eval_hybrid_rewrite_boost_ci.json
          python evals/rag_generation_eval.py
      - name: Diff eval reports vs previous green build
        run: python scripts/diff_eval_reports.py --baseline-dir baseline-reports --current-dir reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports-${{ github.run_id }}
          path: reports/
          retention-days: 30

  docker-config-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Docker compose config
        run: docker compose --env-file .env.example config
      - name: Build core images
        run: docker compose --env-file .env.example build api model-server widget chatbot

  stack-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Boot the backend stack (deterministic, no live Claude)
        env:
          API_REQUIRE_VAULT: "false"
          API_AUTH_OPTIONAL_FOR_DEV: "true"
          API_CHAT_LLM_ENABLED: "false"
          API_ENABLE_DEMO_WIDGET_FALLBACK: "true"
          API_ALLOW_IN_MEMORY_MEMORY: "true"
        run: |
          docker compose --env-file .env.example up -d --build --wait \
            postgres redis minio vault vault-init migrate model-server api
      - name: Smoke-test the running stack
        run: |
          set -e
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health >/dev/null; then echo "api /health ok"; break; fi
            echo "waiting for api ($i/30)"; sleep 3
            [ "$i" = "30" ] && { echo "api never became healthy"; exit 1; }
          done
          echo "== api /health =="; curl -fsS http://localhost:8000/health
          echo "== api /ready =="; curl -fsS http://localhost:8000/ready
          echo "== model-server /health =="; curl -fsS http://localhost:8001/health
          echo "== model-server /classify (real inference) =="
          code=$(curl -s -o /tmp/classify.json -w "%{http_code}" -X POST http://localhost:8001/classify \
            -H "Content-Type: application/json" \
            -d '{"title":"Memory leak in https.request","body":"Repeated requests grow RSS until the process crashes."}')
          echo "classify http $code"; cat /tmp/classify.json; echo
          test "$code" = "200"
      - name: Dump logs on failure
        if: failure()
        run: docker compose --env-file .env.example logs --tail=150
      - name: Tear down
        if: always()
        run: docker compose --env-file .env.example down -v

  redaction-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e services/api[dev]
      - name: Run redaction tests
        run: cd services/api && python -m pytest tests/test_redaction.py tests/test_chat_orchestration.py
      - name: Scan for obvious committed secrets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          ignored = {'.git', '.venv', 'node_modules', 'dist', 'build', '__pycache__'}
          patterns = [
              re.compile(r'sk-(?!test|ant-test)[A-Za-z0-9_-]{16,}'),
              re.compile(r'ANTHROPIC_API_KEY=(?!\\.\\.\\.|replace_me|dummy|example)\\S+'),
          ]
          failures = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or any(part in ignored for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for pattern in patterns:
                  if pattern.search(text):
                      failures.append(str(path))
          if failures:
              print('Potential committed secret patterns found:')
              print('\\n'.join(sorted(set(failures))))
              raise SystemExit(1)
          PY
