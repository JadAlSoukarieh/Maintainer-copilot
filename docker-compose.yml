version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  vault:
    image: hashicorp/vault:1.16
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: vault server -dev
    ports:
      - "8200:8200"

  migrate:
    build:
      context: ./services/api
    command: alembic upgrade head
    env_file:
      - .env
    environment:
      DATABASE_URL: ${API_DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy

  model-server:
    build:
      context: ./services/model-server
    env_file:
      - .env
    environment:
      PORT: ${MODEL_SERVER_PORT}
    ports:
      - "${MODEL_SERVER_PORT}:8001"
    volumes:
      - ./artifacts/classifier:/app/artifacts/classifier
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./services/api
    env_file:
      - .env
    environment:
      PORT: ${API_PORT}
    ports:
      - "${API_PORT}:8000"
    depends_on:
      db:
        condition: service_healthy
      model-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_started
      minio:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  chatbot:
    build:
      context: ./services/chatbot
    env_file:
      - .env
    ports:
      - "${CHATBOT_PORT}:8501"
    depends_on:
      api:
        condition: service_started

  widget:
    build:
      context: ./services/widget
    env_file:
      - .env
    ports:
      - "${WIDGET_PORT}:5173"
    depends_on:
      api:
        condition: service_started

  host:
    build:
      context: ./demo/host
    ports:
      - "${HOST_PORT}:80"
    depends_on:
      widget:
        condition: service_started

volumes:
  postgres-data:
  minio-data:

