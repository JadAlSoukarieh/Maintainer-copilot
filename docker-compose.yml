services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  vault:
    image: hashicorp/vault:1.16
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: vault server -dev
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 5s
      retries: 10

  vault-init:
    image: hashicorp/vault:1.16
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID:-dev-root-token}
    command:
      - "/bin/sh"
      - "-c"
      - |
        vault kv put secret/maintainers-copilot/api jwt_secret=dev-only-jwt-secret-change-me
        vault kv put secret/maintainers-copilot/postgres password=postgres
        vault kv put secret/maintainers-copilot/minio access_key=minioadmin secret_key=minioadmin
        vault kv put secret/maintainers-copilot/anthropic api_key=placeholder-not-required
        echo 'Vault secrets seeded.'
    depends_on:
      vault:
        condition: service_healthy
    restart: "no"

  migrate:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command: alembic upgrade head
    env_file:
      - .env.example
    environment:
      API_DATABASE_URL: ${API_DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy

  model-server:
    build:
      context: ./services/model-server
    env_file:
      - .env.example
    environment:
      PORT: ${MODEL_SERVER_PORT}
      MODEL_SERVER_ARTIFACT_DIR: /app/artifacts/classifier
      MODEL_SERVER_CLASSIFIER_ARTIFACT_DIR: /app/artifacts/classifier/transformer
      MODEL_SERVER_CLASSIFIER_MODEL_DIR: /app/artifacts/classifier/transformer/model
    ports:
      - "${MODEL_SERVER_PORT}:8001"
    volumes:
      - ./artifacts/classifier:/app/artifacts/classifier
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file:
      - .env.example
    environment:
      PORT: ${API_PORT}
      API_REQUIRE_VAULT: ${API_REQUIRE_VAULT:-true}
      API_AUTH_OPTIONAL_FOR_DEV: ${API_AUTH_OPTIONAL_FOR_DEV:-false}
      API_CHAT_LLM_ENABLED: ${API_CHAT_LLM_ENABLED:-true}
      API_CHAT_ALLOW_ENV_KEY_FALLBACK: ${API_CHAT_ALLOW_ENV_KEY_FALLBACK:-false}
      API_ENABLE_DEMO_WIDGET_FALLBACK: ${API_ENABLE_DEMO_WIDGET_FALLBACK:-false}
      API_ALLOW_IN_MEMORY_MEMORY: ${API_ALLOW_IN_MEMORY_MEMORY:-false}
      API_REQUIRE_LLM_KEY: ${API_REQUIRE_LLM_KEY:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      API_OTEL_EXPORTER_ENDPOINT: ${API_OTEL_EXPORTER_ENDPOINT:-http://jaeger:4317}
    ports:
      - "${API_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      model-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
      minio:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./data:/app/data:ro
      - ./reports:/app/reports:ro
      - ./evals:/app/evals:ro
      - ./scripts:/app/services/api/scripts:ro
      - ./artifacts/classifier:/app/artifacts/classifier:ro
      - ./artifacts/rag:/app/artifacts/rag:ro
      - ./prompts:/app/prompts:ro
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface:ro

  chatbot:
    build:
      context: ./services/chatbot
    env_file:
      - .env.example
    environment:
      API_CHAT_LLM_ENABLED: ${API_CHAT_LLM_ENABLED:-true}
    ports:
      - "${CHATBOT_PORT}:8501"
    depends_on:
      api:
        condition: service_started

  widget:
    build:
      context: ./services/widget
    env_file:
      - .env.example
    ports:
      - "${WIDGET_PORT}:5173"
    depends_on:
      api:
        condition: service_started

  host:
    build:
      context: ./demo/host
    ports:
      - "${HOST_PORT}:80"
    depends_on:
      widget:
        condition: service_started

  jaeger:
    image: jaegertracing/all-in-one:1.58
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC receiver

volumes:
  postgres-data:
  minio-data:
